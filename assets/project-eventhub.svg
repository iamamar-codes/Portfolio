      <stop offset="0" stop-color="#03120a"/><stop offset=".6" stop-color="#064e3b"/><stop offset="1" stop-color="#3f6212"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/><stop offset=".5" stop-color="#22c55e"/><stop offset="1" stop-color="#bef264"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="150" fill="#22c55e" opacity=".1"/>
  <circle cx="720" cy="400" r="150" fill="#bef264" opacity=".08"/>

  <!-- browser window -->
